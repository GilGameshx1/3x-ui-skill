name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  secrets:
    name: "нет секретов в репозитории"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_no_secrets.sh --all

  shellcheck:
    name: "shellcheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: "shellcheck -x -S warning"
        run: |
          mapfile -t files < <(find scripts tests -name '*.sh' -o -name '*.bash' -o -name '*.bats'; echo install.sh)
          shellcheck -x -S warning "${files[@]}"

  python:
    name: "python: синтаксис и CLI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m py_compile scripts/lib/xui.py scripts/verify_vless.py tests/fake_panel.py
          python3 scripts/lib/xui.py --help >/dev/null
          python3 scripts/verify_vless.py --help >/dev/null

  bats:
    name: "bats: тесты на фикстурах"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bats sqlite3 jq
      - run: bats --tap tests/
